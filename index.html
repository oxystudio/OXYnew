<style>
:root{--bg:#050506;--card:#111114;--card2:#18181c;--ln:#232328;--mu:#8e8e93;--ac:#3b82f6;--c:#e10600;color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#050506;color:#fff;font:16px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#shell{display:block;min-height:100vh}
#side{display:none}
#app{max-width:640px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 110px;animation:fi .25s}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
button{font:inherit;color:inherit}
.top{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.chips{display:flex;gap:8px;overflow-x:auto;flex:1;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:#1a1a1e;color:#d1d1d6;padding:11px 20px;border-radius:22px;font-size:15px;font-weight:600}
.chip.on{background:#fff;color:#000}
.ib{flex:none;width:40px;height:40px;border:0;background:none;color:#fff;font-size:22px}
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;scrollbar-width:none;border-radius:24px}.car::-webkit-scrollbar{display:none}
.hc{position:relative;flex:none;width:100%;height:250px;scroll-snap-align:center;border-radius:24px;overflow:hidden;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 70%,#000) 0,#0b0b0d 85%);cursor:pointer}
.hc img.ph,.dh img.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hc .sil{position:absolute;right:-10px;top:26px;width:260px;opacity:.16;color:#fff}
.hc:after,.dh:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(0,0,0,.78))}
.hx{position:absolute;left:18px;right:18px;bottom:16px;z-index:2}
.hx h2{font-size:28px;margin:8px 0 4px;line-height:1.05;letter-spacing:-.5px}.hx .r{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;font-size:15px}
.pill{display:inline-block;background:#2a2a2f;color:#fff;font-size:12px;font-weight:700;padding:5px 11px;border-radius:14px}
.hc .pill{position:absolute;left:16px;top:16px;z-index:2;background:rgba(0,0,0,.55)}
.dots{display:flex;justify-content:center;gap:7px;margin:12px 0 4px}.dots i{width:7px;height:7px;border-radius:50%;background:#3a3a3f}.dots i.on{background:#fff}
.sec{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px}.sec h3{margin:0;font-size:22px}.sec button{background:none;border:0;color:var(--ac);font-size:14px}
.lst{background:var(--card);border-radius:20px;padding:2px 12px}
.it{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--ln);cursor:pointer}.it:last-child{border:0}
.it .fl{font-size:26px;width:36px;text-align:center}.im{flex:1;min-width:0}.im b{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.im small{color:var(--mu);font-size:13px}
.idt{font-size:14px;color:#e5e5ea;white-space:nowrap}.it i{font-style:normal;color:#555}
.it .pill{min-width:44px;text-align:center}.it.past{opacity:.55}
.tiles{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}.tiles::-webkit-scrollbar{display:none}
.tile{flex:none;width:92px;background:var(--card);border-radius:16px;padding:14px 6px 10px;text-align:center;border:0;cursor:pointer}
.tile small{display:block;margin-top:6px;font-weight:700;font-size:13px}.tile em{font-style:normal;color:var(--mu);font-size:12px}
.lgt{font-style:italic;font-weight:900;font-size:22px;letter-spacing:-1px;display:inline-block;height:30px;line-height:30px}
img.lg{height:30px;max-width:70px;object-fit:contain}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(12,12,14,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--ln);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav div{display:flex;max-width:640px;margin:0 auto}nav button{flex:1;background:none;border:0;color:var(--mu);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}nav button i{font-style:normal;font-size:23px}nav button.on{color:var(--ac)}
.seg{display:flex;background:#151518;border-radius:14px;padding:4px;margin:0 0 12px}.seg button{flex:1;border:0;background:none;color:var(--mu);padding:10px 0;border-radius:11px;font-size:15px;font-weight:600}.seg button.on{background:#2c2c2e;color:#fff}
h1{font-size:30px;margin:4px 0 14px;letter-spacing:-.6px}
.dh{position:relative;height:230px;margin:-12px -16px 0;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 70%,#000) 0,#0b0b0d 85%);overflow:hidden}
.dh .sil{position:absolute;right:-10px;top:50px;width:260px;opacity:.14;color:#fff}
.dbar{position:absolute;left:14px;right:14px;top:calc(14px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;z-index:2}
.cb{width:44px;height:44px;border-radius:50%;border:0;background:rgba(0,0,0,.5);backdrop-filter:blur(10px);color:#fff;font-size:20px;margin-left:8px}.dbar>.cb:first-child{margin:0}
.dtx{position:absolute;left:16px;right:16px;bottom:14px;z-index:2}.dtx h2{font-size:30px;margin:6px 0 4px;letter-spacing:-.6px;line-height:1.05}.dtx .r{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}.dtx .r b{font-size:17px;white-space:nowrap}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--ln);margin:14px 0 6px}.tabs button{background:none;border:0;color:#d1d1d6;padding:12px 0;font-size:16px;font-weight:600;border-bottom:3px solid transparent}.tabs button.on{color:#fff;border-color:var(--ac)}
.dg{display:block}.card{background:var(--card);border-radius:20px;padding:16px;margin-top:12px}.card h4{margin:0 0 10px;font-size:17px}.card p{margin:0;color:#d1d1d6;font-size:14px;line-height:1.45}
.day{font-size:18px;font-weight:700;margin:20px 0 8px}
